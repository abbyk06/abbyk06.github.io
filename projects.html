<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canon PowerShot ELPH 180</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="shortcut icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="../../script.js" defer></script>
</head>

<body>
    <div class="cursor-trail"></div>
    <header>
        <h1>Projects</h1>
    </header>

        <div style="display: block;">

            <!-- Card 1 - TouchDesigner video -->
            <div class="flip-card">
                <div class="flip-inner">
                    <div class="flip-front" style="position:relative;">
                        <div style="padding:60.64% 0 0 0; position:relative;">
                            <iframe
                                src="https://player.vimeo.com/video/1171438299?badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1&muted=1&loop=1"
                                frameborder="0"
                                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                                referrerpolicy="strict-origin-when-cross-origin"
                                style="position:absolute;top:0;left:0;width:100%;height:100%;"
                                title="touchdesigner1">
                            </iframe>
                        </div>
                        <script src="https://player.vimeo.com/api/player.js"></script>
                    </div>
                    <div class="flip-back">
                        <div>
                            <strong>TouchDesigner #1</strong>
                            <p>First try at TouchDesigner!</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 2 - Dead Internet -->
            <div class="flip-card">
                <div class="flip-inner">
                    <div class="flip-front">
                        <img src="project-files/deadinternet.png" alt="Dead Internet">
                    </div>
                    <div class="flip-back">
                        <div>
                            <strong>Dead Internet</strong>
                            <p>Bot detection analysis on Reddit comment data in a Jupyter Notebook with Python.</p>
                            <a href="https://github.com/abbyk06/DeadInternet" target="_blank">GitHub →</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
